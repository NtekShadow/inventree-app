name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Setup Flutter and FVM
        id: fvm-config-action
        uses: kuhnroyal/flutter-fvm-config-action@v2

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true

      - name: Collect Translation Files
        run: |
          cd lib/l10n
          python3 collect_translations.py

      - name: Install Dependencies
        run: |
          dart pub global activate fvm
          fvm install
          fvm flutter pub get

      - name: Build APK
        run: |
          fvm flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk inventree-companion-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: android-apk
          path: inventree-companion-android.apk

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Setup Flutter and FVM
        id: fvm-config-action
        uses: kuhnroyal/flutter-fvm-config-action@v2

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true

      - name: Collect Translation Files
        shell: bash
        run: |
          cd lib/l10n
          python collect_translations.py

      - name: Install Dependencies
        shell: bash
        run: |
          dart pub global activate fvm
          fvm install
          fvm flutter pub get

      - name: Build Windows Release
        shell: bash
        run: |
          fvm flutter build windows --release

      - name: Package Windows Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath inventree-companion-windows-x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v3
        with:
          name: windows-zip
          path: inventree-companion-windows-x64.zip

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Android Artifact
        uses: actions/download-artifact@v3
        with:
          name: android-apk
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v3
        with:
          name: windows-zip
          path: release-assets/

      - name: Determine Tag
        id: tag_name
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v0.25.2-sso-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag_name.outputs.TAG }}
          name: InvenTree Companion ${{ steps.tag_name.outputs.TAG }}
          body: |
            ## InvenTree Companion Release with Authentik SSO / OIDC Support

            ### Features & Changes:
            - **Authentik OIDC / SSO Support:** Native in-app login via OAuth/OIDC with automatic InvenTree API token issuance.
            - **Windows Desktop Support:** Native Microsoft Edge WebView2 integration (`webview_windows`) and Win32 ATL shims.
            - **Mobile Support:** Android & iOS in-app WebView authentication (`webview_flutter`).
            - **Fallback Authentication:** Username / Password and direct manual API token entry.
            - **Enhanced Localization:** Complete German (`de_DE`) and English (`en`) translations.

            ### Downloads:
            - `inventree-companion-android.apk`: Android standalone APK installer
            - `inventree-companion-windows-x64.zip`: Windows 64-bit desktop application
          files: |
            release-assets/inventree-companion-android.apk
            release-assets/inventree-companion-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
